[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscient-convergence-protocol"
version = "0.1.0"
description = "A Multi-Agent AI System for Coordinated Intelligence and Temporal Wealth Synthesis"
authors = [{name = "OCP Research Team"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "multi-agent", "coordination", "temporal-synthesis", "swarm-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "networkx>=3.1",
    "asyncio-mqtt>=0.16.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "aiohttp>=3.8.0",
    "websockets>=11.0",
    "redis>=4.5.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mysgeniels75-byte/Triplexglyphion"
Repository = "https://github.com/mysgeniels75-byte/Triplexglyphion"
Documentation = "https://github.com/mysgeniels75-byte/Triplexglyphion/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocp*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
